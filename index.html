<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamroh AI</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    .iframe-wrap {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: #fff;
    }

    iframe {
      border: 0;
      position: absolute;
      top: 0;
      left: 0;
      width: 1440px;   /* desktop base width */
      height: 100vh;
      transform-origin: top left;
    }

    /* Telefonlar uchun avtomatik kichraytirish */
    @media (max-width: 768px) {
      iframe {
        transform: scale(calc(100vw / 1440));
        height: calc(100vh / (100vw / 1440));
      }
    }
  </style>
</head>
<body>
  <div class="iframe-wrap">
    <iframe src="https://shell-role-88025916.figma.site"></iframe>
  </div>
</body>
</html>
