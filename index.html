<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamroh AI</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      border: none;
      background: #ffffff;
      width: 100%;
      height: 100%;
    }

    /* Telefon uchun: Figma saytni kichraytirib markazda ko'rsatish */
    @media (max-width: 768px) {
      .wrap {
        align-items: flex-start;
      }

      iframe {
        width: 420px;
        height: 100vh;
        transform: scale(0.85);
        transform-origin: top center;
      }
    }

    /* Juda tor ekranlar uchun */
    @media (max-width: 480px) {
      iframe {
        width: 420px;
        height: 100vh;
        transform: scale(0.72);
        transform-origin: top center;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe src="https://shell-role-88025916.figma.site"></iframe>
  </div>
</body>
</html>
